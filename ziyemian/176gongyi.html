/* 卡片 */
.card{
  margin-bottom:24px;

  border-radius:14px;

.card h2{

/* 卖点列表 */
.points{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px;margin:0;padding:0;list-style:none}
.points li{

  color:#f6e6c8;
  border-radius:9px;
  background:rgba(255,190,90,.06);
  border:1px solid rgba(255,205,110,.16);
}
.points li::before{
  content:"◆";
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:14px;color:#ff9a30;
  text-shadow:0 0 10px rgba(255,150,40,.9);
}

/* 下载按钮 */
.dl{

  text-shadow:
    -1px 0 0 #7A3200, 1px 0 0 #7A3200,
    0 -1px 0 #7A3200, 0 1px 0 #7A3200,
    0 0 8px rgba(255,190,60,.95),
    0 2px 3px rgba(0,0,0,.5);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.6),
    inset 0 -2px 4px rgba(0,0,0,.3),
    0 4px 10px rgba(0,0,0,.45);
  transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;
}
.dl:hover{
  transform:translateY(-3px);
  filter:brightness(1.14) saturate(1.08);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.7),
    inset 0 -2px 4px rgba(0,0,0,.3),
    0 0 30px rgba(255,150,40,.8),
    0 10px 22px rgba(0,0,0,.55);
}
.dl:active{transform:translateY(-1px) scale(.995)}
.dl .sub{
  display:block;
  margin-top:4px;
  font-size:14px;font-weight:normal;letter-spacing:1px;
  color:rgba(255,235,190,.8);
  text-shadow:0 1px 2px rgba(0,0,0,.7);
}
.dl .inner{text-align:center;line-height:1.25}

/* 提示 */
.notice{
  margin-top:22px;
  padding:14px 18px;
  font-size:14px;line-height:1.9;
  text-align:center;
  color:rgba(255,224,180,.7);
  border-top:1px dashed rgba(255,205,110,.25);
}

@media (max-width:760px){
  .wrap{padding:34px 16px 50px}
  .head h1{font-size:30px;letter-spacing:3px}
  .head .site{font-size:14px}
  .card{padding:20px 18px}
  .card h2{font-size:19px;margin-bottom:14px}
  .points{grid-template-columns:1fr}
  .points li{font-size:15px}
  .dl{height:72px;font-size:21px;letter-spacing:2px}
  .dl .sub{font-size:12px}
}
</style>
</head>
