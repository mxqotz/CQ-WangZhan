/* ============ 背景海报：dh_01(480) + dh_02(296) + dh_03(310) 顺序无缝拼接 ============
   三张图同为 1920 宽，是同一张海报横切下来的三段。
   每一段都严格锁定自身原始宽高比，只用「宽度 100% + 原始比例」来定高，
   绝不使用 cover / 100% 100% 这类会裁切或拉伸的写法，因此图案不会变形。
   段与段之间没有留白、没有重叠，严丝合缝还原成一整张完整海报。

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ---- 第 1 段：dh_01  1920x480 ---- */
.band1{

}

/* ---- 第 2 段：dh_02  1920x296 ----
   图片本身锁定原始比例铺在顶部，绝不拉伸；
   内容比原图高时，多出来的部分用 dh_02 底边色(#693a2f)填充，
   而这个颜色同时就是 dh_03 的顶边色，所以进入下一段时依旧无缝。 */
.band2{
  position:relative;
  width:100%;
  background-color:#693a2f;      /* = dh_02 底边色 = dh_03 顶边色 */
  overflow:hidden;
}
.band2 .bg{
  position:absolute;top:0;left:0;
  width:100%;
  aspect-ratio:1920 / 296;
  background:url(images/dh_02.jpg) center top / 100% 100% no-repeat;
  pointer-events:none;
}
/* 内容区压暗：两端透明，保证上下接缝颜色不受影响 */
.band2 .shade{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,.34) 26%,
    rgba(0,0,0,.34) 84%,
    rgba(0,0,0,0) 100%);
  pointer-events:none;
}

/* ---- 第 3 段：dh_03  1920x310 ----

.band3{

  background-color:#52221d;      /* = dh_03 底边色 */

}
.band3 .bg{
